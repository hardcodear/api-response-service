name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["12", "13"]
        exclude:
          - php: "8.2"
            laravel: "13"

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (Laravel 12)
        if: matrix.laravel == '12'
        run: >
          composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies
          --with illuminate/support:^12.0
          --with illuminate/http:^12.0
          --with illuminate/auth:^12.0
          --with orchestra/testbench:^10.0

      - name: Install dependencies (Laravel 13)
        if: matrix.laravel == '13'
        run: >
          composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies
          --with illuminate/support:^13.0
          --with illuminate/http:^13.0
          --with illuminate/auth:^13.0
          --with orchestra/testbench:^11.0

      - name: Run test suite
        run: composer test

      - name: Audit production dependencies
        run: composer audit --locked --no-dev

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "12"
          - php: "8.3"
            laravel: "13"

    name: Minimum dependencies · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install minimum dependencies (Laravel 12)
        if: matrix.laravel == '12'
        run: >
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction --with-all-dependencies
          --with illuminate/support:^12.0
          --with illuminate/http:^12.0
          --with illuminate/auth:^12.0
          --with orchestra/testbench:^10.0

      - name: Install minimum dependencies (Laravel 13)
        if: matrix.laravel == '13'
        run: >
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction --with-all-dependencies
          --with illuminate/support:^13.0
          --with illuminate/http:^13.0
          --with illuminate/auth:^13.0
          --with orchestra/testbench:^11.0

      - name: Run test suite
        run: composer test

  consumer-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "12"
          - php: "8.3"
            laravel: "13"
    name: Consumer install · Laravel ${{ matrix.laravel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install exported package in a fresh Laravel application
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: bash scripts/consumer-install.sh

  ci:
    name: CI
    if: ${{ always() }}
    needs: [phpunit, minimum-dependencies, consumer-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and installation job to succeed
        env:
          PHPUNIT_RESULT: ${{ needs.phpunit.result }}
          MINIMUM_RESULT: ${{ needs.minimum-dependencies.result }}
          CONSUMER_RESULT: ${{ needs.consumer-install.result }}
        run: |
          test "$PHPUNIT_RESULT" = success
          test "$MINIMUM_RESULT" = success
          test "$CONSUMER_RESULT" = success
